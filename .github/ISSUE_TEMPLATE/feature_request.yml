name: 💡 기능 제안
description: 새로운 아이디어가 있으신가요? 편하게 제안해주세요!
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 💭 어떤 불편함이 있었나요?
      description: 기능 제안의 배경이 된 불편함이나 문제를 알려주세요. (예 - "~할 때 항상 불편해서요...")
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: ✨ 원하시는 기능은?
      description: 어떤 기능이 있으면 좋겠는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 🎯 완료 기준
      description: 어떻게 되면 이 이슈를 닫아도 될까요? 하위 이슈로 나눌 거라면 목록을 적어주세요.
      placeholder: |
        - [ ] 관리자가 ~을 설정할 수 있다
        - [ ] 사용자 화면에 ~이 보인다
  - type: textarea
    id: alternative
    attributes:
      label: 🔄 다른 방법도 고려해보셨나요?
      description: 지금 사용하고 계신 대안이 있다면 알려주세요. (선택사항)
  - type: textarea
    id: etc
    attributes:
      label: 💬 추가 정보
      description: 참고할 내용이나 스크린샷이 있다면 첨부해주세요.
