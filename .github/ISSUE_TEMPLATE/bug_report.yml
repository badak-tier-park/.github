name: 🐛 버그 제보
description: 버그를 발견하셨나요? 알려주시면 빠르게 고칠게요!
title: "bug: "
labels: [bug]
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: 🐛 어떤 버그인가요?
      description: 무슨 문제가 발생했는지 간단하게 설명해주세요.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: 📍 어느 화면인가요?
      description: 메뉴 이름이나 주소를 적어주세요. (예 - 리그 참여 > 엔트리 제출)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 🔁 재현 방법
      description: 버그를 다시 발생시키는 방법을 순서대로 알려주세요. 재현 방법이 없으면 고쳤는지 확인할 수 없어요.
      placeholder: |
        1. '...' 로 이동
        2. '...' 클릭
        3. 오류 확인
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✅ 기대했던 동작
      description: 원래 어떻게 동작해야 한다고 생각하셨나요?
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 💻 기기
      options:
        - PC
        - 휴대폰 (브라우저)
        - 휴대폰 (홈 화면에 설치한 앱)
        - 태블릿
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 환경 정보
      description: OS·브라우저를 알려주세요. (예 - iOS 18 Safari, Windows 11 Chrome)
  - type: textarea
    id: screenshot
    attributes:
      label: 📸 스크린샷
      description: 버그 화면을 캡처하셨다면 끌어다 놓아 주세요. (선택사항)
  - type: textarea
    id: etc
    attributes:
      label: 💬 추가 정보
